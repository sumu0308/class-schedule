# ── 内存与构建性能 ────────────────────────────────────────────────
# 手机热点的网络不稳，给 Gradle 足够的超时与重试耐心
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 依赖下载失败时重试更久一点，避免移动网络下频繁中断
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# 显式清空代理：本机 Windows 系统代理指向 127.0.0.1:7897，但代理软件没开时
# Java/Gradle 会照读注册表里的设置，导致所有依赖下载失败（实测确认过）。
# 置空即强制直连。若将来需要走代理，把下面两行删掉即可。
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=

# ── 签名 ─────────────────────────────────────────────────────────
# 调试用的密钥库固定放在项目内 .keystore/debug.keystore（见 app/build.gradle.kts）。
# 这样既不受工作区沙箱对 C:\Users\<用户>\.android 的写限制，也让项目自包含、
# 换台电脑不用重新生成。正式发布密钥在 M6 阶段另行生成。

# ── Android ──────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
# SDK 组件由 tools/install-sdk-packages.mjs 离线装好，不让 AGP 在构建时联网自动下载：
# 它的下载走 Java 网络栈，在移动网络下经常卡在 "Still waiting for package manifests"。
android.builder.sdkDownload=false
# 不发送使用统计
android.enableProfileJson=false
